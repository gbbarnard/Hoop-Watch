<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoop Watch - Live NBA Games</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <img src="HoopWatch.png" alt="Hoop Watch Logo" class="logo-img">
            <span class="brand-name">HOOP WATCH</span>
        </div>
    </nav>

    <div class="container">
        <div class="hero-section">
            <h1>Live NBA Games</h1>
            <p>Today's games updating in real-time</p>
            <button onclick="manualRefresh()" class="refresh-btn">Refresh Now</button>
        </div>

        <div id="games-container" class="games-container">
            <div class="loading">Loading games...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
