<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoopWatch | Live NBA Games</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
        <nav class="navbar">
        <div class="nav-brand">
            <img src="HoopWatch.png" alt="Hoop Watch Logo" class="logo-img">
            <span class="brand-name">HoopWatch</span>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="games.html">Season Games</a></li>
            <li><a href="teams.html">Teams</a></li>
            <li><a href="myfeed.html">My Feed</a></li>
            <li><a href="qotd.html">QOTD</a></li>
        </ul>
    <div class="nav-actions nav-auth-slot"></div>
    </nav>

    <div class="container">
        <div class="hero-section">
            <h1>Live NBA Games</h1>
            <p>Today's games updating in real-time</p>
            <div class="hero-action-row">
                <button onclick="manualRefresh()" class="refresh-btn">Refresh Now</button>
                <a href="games.html" class="secondary-action-btn">See Full Season Schedule</a>
            </div>
        </div>

        <div id="home-qotd-card" class="home-qotd-card home-qotd-loading">

            <h2>Loading today’s question...</h2>
            <p>Click to answer on the QOTD page.</p>
        </div>

        <div id="games-container" class="games-container">
            <div class="loading">Loading games...</div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="app.js"></script>
