<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Details | Basketball App</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Page header -->
  <header>
    <div class="container">
      <h1>Team Details</h1>
      <p class="muted">Team information and roster.</p>
    </div>
  </header>

  <!-- Main content container -->
  <main class="container">
    <!-- Back button to return to the teams list -->
    <a class="button" href="teams.html">Back to Teams</a>

    <!-- Team summary section -->
    <section class="team-summary" id="teamSummary">
      <div style="display:flex; align-items:center; gap:14px;">
        <img id="teamLogo" alt="Team logo" style="width:56px; height:56px; object-fit:contain;" />
        <h2 id="teamName" style="margin:0;">Loading...</h2>
      </div>
      <div class="summary-grid">
        <div class="summary-item"><strong>City:</strong> <span id="teamCity">-</span></div>
        <div class="summary-item"><strong>Arena:</strong> <span id="teamArena">-</span></div>
        <div class="summary-item"><strong>Wins:</strong> <span id="teamWins">-</span></div>
        <div class="summary-item"><strong>Losses:</strong> <span id="teamLosses">-</span></div>
      </div>
    </section>

    <!-- Players table section -->
    <section class="table-wrapper">
      <h3>Players</h3>
      <table class="players-table">
        <thead>
          <tr>
            <th>Player Name</th>
            <th>Position</th>
            <th>Jersey Number</th>
            <th>Height</th>
          </tr>
        </thead>
        <tbody id="playersBody">
          <tr>
            <td colspan="4">Loading players...</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    const API_BASE = "http://localhost:8000";

    // Read the team id from the URL query string
    const params = new URLSearchParams(window.location.search);
    const teamId = params.get("id");

    // Cache DOM elements for faster updates
    const teamName = document.getElementById("teamName");
    const teamLogo = document.getElementById("teamLogo");
    const teamCity = document.getElementById("teamCity");
    const teamArena = document.getElementById("teamArena");
    const teamWins = document.getElementById("teamWins");
    const teamLosses = document.getElementById("teamLosses");
    const playersBody = document.getElementById("playersBody");

    // Mock team details to use if the API is not available yet
    const mockTeamDetails = {
      id: 1,
      name: "Lakers",
      city: "Los Angeles",
      arena: "Crypto.com Arena",
      wins: 44,
      losses: 28
    };

    // Mock players list to use if the API is not available yet
    const mockPlayers = [
      { name: "LeBron James", position: "SF", jersey: 23, height: "6'9\"" },
      { name: "Anthony Davis", position: "PF", jersey: 3, height: "6'10\"" },
      { name: "D'Angelo Russell", position: "PG", jersey: 1, height: "6'4\"" }
    ];

    // Render team details into the summary section
    function renderTeamDetails(team) {
      teamName.textContent = team.name;

      // Set logo (API returns /static/... so we prefix API_BASE)
      const logoSrc = team.logo_url
        ? (team.logo_url.startsWith("http") ? team.logo_url : `${API_BASE}${team.logo_url}`)
        : "";
      teamLogo.src = logoSrc;
      teamLogo.style.display = logoSrc ? "block" : "none";
      teamLogo.onerror = () => { teamLogo.style.display = "none"; };

      teamCity.textContent = team.city;
      teamArena.textContent = team.arena;
      teamWins.textContent = team.wins;
      teamLosses.textContent = team.losses;
    }

    // Render players into the table body
    function renderPlayers(players) {
      playersBody.innerHTML = "";

      if (!players.length) {
        playersBody.innerHTML = `<tr><td colspan="4">No players found.</td></tr>`;
        return;
      }

      players.forEach((player) => {
        const row = document.createElement("tr");

        const headshot = player.headshot_url
          ? (player.headshot_url.startsWith("http") ? player.headshot_url : `${API_BASE}${player.headshot_url}`)
          : `${API_BASE}/static/Headshots/placeholder.png`;

        row.innerHTML = `
      <td style="display:flex;align-items:center;gap:10px;">
        <img
          src="${player.headshot_url}"
          alt="${player.name}"
          loading="lazy"
          onerror="this.onerror=null; this.src='/static/Headshots/placeholder.png';"
        />
        ${player.name}
      </td>
      <td>${player.position || ""}</td>
      <td>${player.jersey ?? ""}</td>
      <td>${player.height || ""}</td>
    `;

        playersBody.appendChild(row);
      });
    }

    // Fetch team details from Flask API
    async function loadTeamDetails() {
      if (!teamId) {
        teamName.textContent = "Team not found";
        return;
      }

      try {
        const response = await fetch(`http://localhost:8000/api/teams/${teamId}`);
        if (!response.ok) {
          throw new Error("Failed to fetch team details from API");
        }
        const team = await response.json();
        renderTeamDetails(team);
      } catch (error) {
        console.warn("API unavailable, using mock data:", error);
        renderTeamDetails(mockTeamDetails);
      }
    }

    // Fetch players from Flask API
    async function loadPlayers() {
      if (!teamId) {
        playersBody.innerHTML = "<tr><td colspan=\"4\">No team selected.</td></tr>";
        return;
      }

      try {
        const response = await fetch(`http://localhost:8000/api/teams/${teamId}/players`);
        if (!response.ok) {
          throw new Error("Failed to fetch players from API");
        }
        const players = await response.json();
        renderPlayers(players);
      } catch (error) {
        console.warn("API unavailable, using mock data:", error);
        renderPlayers(mockPlayers);
      }
    }

    // Load data when the page is ready
    loadTeamDetails();
    loadPlayers();
  </script>
</body>

</html>
